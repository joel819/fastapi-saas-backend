services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # runs in demo mode without a .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped

volumes:
  sqlite-data:
